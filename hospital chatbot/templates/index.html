<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-dot" id="statusDot"></span>
        Hospital Assistant
      </div>
      <button id="newChatBtn" class="new-chat-btn" type="button" title="Start a new conversation">
        New conversation
      </button>
    </header>

    <main id="chatWindow" class="chat-window" aria-live="polite"></main>

    <div id="emergencyBanner" class="emergency-banner hidden" role="alert">
      This may be urgent. Please seek immediate medical attention or contact emergency services.
    </div>

    <footer class="composer">
      <form id="composerForm" class="composer-form">
        <textarea
          id="messageInput"
          class="composer-input"
          placeholder="Message Hospital Assistant..."
          rows="1"
          autofocus
        ></textarea>
        <button id="micBtn" class="voice-btn" type="button" aria-label="Start voice conversation" title="Start voice conversation" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <div id="voiceStatus" class="voice-status hidden" aria-live="polite"></div>
      <div class="composer-hint">
        Not a medical diagnosis. In an emergency, contact your local emergency number directly.
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
